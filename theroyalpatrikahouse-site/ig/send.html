<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>RPH post helper</title>
<p id="s">Sending images…</p>
<script>
(async () => {
  const names = [1,2,3,4,5,6].map(i => "post-" + i + ".jpg");
  const files = [];
  for (const n of names) { const r = await fetch(n, {cache: "no-store"}); files.push({name: n, type: "image/jpeg", buf: await r.arrayBuffer()}); }
  const send = () => { if (window.opener) window.opener.postMessage({rph: true, files}, "https://www.instagram.com"); };
  send(); setInterval(send, 1500);
  document.getElementById("s").textContent = window.opener ? "Images sent to Instagram tab." : "No Instagram tab connected.";
})();
</script>
